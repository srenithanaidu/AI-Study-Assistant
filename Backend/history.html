<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study History - AI Study Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .history-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .question {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .answer {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 Study History</h1>

        {% if history %}

            {% for question, answer in history %}

                <div class="history-card">

                    <div class="question">
                        ❓ {{ question }}
                    </div>

                    <div class="answer">
                        {{ answer }}
                    </div>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">
                <p>No study history yet.</p>
            </div>

        {% endif %}

        <a href="/" class="back-btn">⬅ Back to AI Study Assistant</a>

    </div>

</body>
</html>
